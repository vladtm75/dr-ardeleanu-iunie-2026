<!DOCTYPE html>
<html lang="ro">
<head>
<script>if(sessionStorage.getItem("reportsAuth")!=="1"){var _f=(location.pathname.split("/").pop()||"");location.replace("index.html?next="+encodeURIComponent(_f));}</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Analiza Cashflow · Iunie 2026 · Dr. Ardeleanu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;}
#root:empty::before{
  content:'Se încarcă raportul de cashflow…';
  display:flex;align-items:center;justify-content:center;height:100vh;
  color:#7B1C16;font-size:14px;font-weight:600;
}
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1"
  }
}
</script>

</head>
<body>
<div id="root"></div>
<script type="module" src="cashflow-report.js"></script>

<!-- ── NAVIGARE: butoane integrate in headerul raportului ── -->
<style id="drNavCss">
.drNav{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.drNav a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-family:'Poppins',system-ui,-apple-system,sans-serif;font-size:11.5px;font-weight:600;
  letter-spacing:.02em;padding:7px 13px;border-radius:999px;white-space:nowrap;
  transition:background .15s ease;-webkit-tap-highlight-color:transparent;}
.drNav a.home{background:rgba(255,255,255,.14);color:#F5EDE3;border:1px solid rgba(242,218,183,.45);}
.drNav a.home:hover{background:rgba(255,255,255,.26);}
.drNav a.alt{background:transparent;color:#F2DAB7;border:1px solid rgba(242,218,183,.35);}
.drNav a.alt:hover{background:rgba(242,218,183,.16);}
#drNavFb{position:fixed;top:10px;left:12px;z-index:9997;padding:6px 8px;border-radius:999px;
  background:#7B1C16;box-shadow:0 4px 14px rgba(60,20,14,.28);}
@media print{.drNav{display:none;}}
</style>
<script>
(function(){
  var ALT="cashflow-summary.html", ALTLBL="📱 Versiune mobil";
  var BURG=["123, 28, 22","142, 32, 25","92, 21, 16","101, 21, 17","94, 21, 15"];
  function isB(e){var cs=getComputedStyle(e),s=cs.backgroundColor+" "+cs.backgroundImage;
    for(var i=0;i<BURG.length;i++){if(s.indexOf(BURG[i])>-1)return true;}return false;}
  function findHeader(){
    var vw=window.innerWidth,els=document.querySelectorAll('header,div,section');
    for(var i=0;i<els.length;i++){var e=els[i];
      if(e.className&&(""+e.className).indexOf('drNav')>-1)continue;
      var r=e.getBoundingClientRect();
      if(r.top>200||r.width<vw*0.4||r.height<36||r.height>200)continue;
      if(isB(e))return e;}
    return null;}
  function build(){var d=document.createElement('div');d.className='drNav';
    d.innerHTML='<a class="home" href="index.html">\u2190 Pagina principală</a>'+
                '<a class="alt" href="'+ALT+'">'+ALTLBL+'</a>';return d;}
  var tries=0;
  function mount(){
    if(document.querySelector('.drNav'))return;
    var h=findHeader();
    if(h){var d=build(),cs=getComputedStyle(h);
      if(cs.display==='flex'&&cs.flexDirection.indexOf('row')===0){d.style.marginRight='14px';}
      else{d.style.margin='0 0 12px 0';}
      h.insertBefore(d,h.firstChild);return;}
    if(++tries<30){setTimeout(mount,200);return;}
    var fb=build();fb.id='drNavFb';document.body.appendChild(fb);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(mount,350);});
  else setTimeout(mount,350);
})();
</script>
</body>
</html>
